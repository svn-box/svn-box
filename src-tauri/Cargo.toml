[package]
name = "svnbox-app"
version = "0.4.0"
description = "仓盒 · 面向 macOS 的多工作副本 SVN 客户端"
authors = ["svnbox contributors"]
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.93"

[lib]
name = "svnbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-smoke = ["dep:block2", "dep:objc2-web-kit", "dep:objc2-app-kit", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "2"
arboard = { version = "3.7", default-features = false }
tauri-plugin-updater = "=2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
roxmltree = "0.21"
regex = "1"
url = "2"
percent-encoding = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
block2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSString", "NSError"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.build-override]
strip = false
