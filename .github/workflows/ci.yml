name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: xcode-27
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '26'
                  cache: npm
            - name: Install native build and test tools
              run: brew install subversion scons pkgconf
            - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
              with:
                  path: |
                      .cache/svn-runtime
                      resources/svn/darwin-arm64
                  key: svn-native-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('scripts/build-svn-*.mjs', 'resources/native-patches/**') }}
            - run: npm ci
            - run: npm run format:check
            - run: npm run release:check
            - run: npm test
            - run: npm run build
            - run: git diff --exit-code -- package.json package-lock.json src/renderer/src/styles/tokens.css
