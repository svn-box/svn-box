name: Validate Tauri SVNBox
on:
    pull_request:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: validate-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    check:
        runs-on: xcode-27
        timeout-minutes: 60
        env:
            RUSTUP_TOOLCHAIN: '1.99.1'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: ./.github/actions/prepare-build
            - run: npm run format:check
            - run: npm run build
            - run: npm test
            - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --test-threads=1
            - run: npm run check:rust
            - run: npm run licenses:check
