name: Prepare macOS build
description: Install the pinned toolchains and prepare shared native resources once per job.
runs:
    using: composite
    steps:
        - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
          with:
              node-version: '26'
              cache: npm
        - name: Set up Rust
          shell: bash
          run: |
              set -euo pipefail
              if ! command -v rustup >/dev/null; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
                printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                export PATH="$HOME/.cargo/bin:$PATH"
              fi
              rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
              test "$(uname -m)" = arm64
        - run: npm ci
          shell: bash
        - run: brew install subversion scons pkgconf
          shell: bash
        - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
          with:
              path: |
                  .cache/svn-runtime
                  resources/svn/darwin-arm64
              key: svn-native-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('scripts/build-svn-*.mjs', 'resources/native-patches/**') }}
        - run: npm run svn:build
          shell: bash
        - run: npm run icons:build
          shell: bash
